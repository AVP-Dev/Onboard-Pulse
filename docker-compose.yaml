services:
  onboard-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onboard-pulse
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_PATH=/app/data/pulse.db
    volumes:
      - pulse-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/dev/seed"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pulse-data:
